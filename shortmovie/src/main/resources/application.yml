spring:
  application:
    name: shortmovie
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/video_platform?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 500MB      # 单个文件最大大小
      max-request-size: 500MB   # 单次请求最大大小
  kafka:
    # Kafka集群地址
    bootstrap-servers: localhost:9092
    # 生产者配置
    producer:
      # 消息键的序列化方式
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 消息值的序列化方式（修改为JSON序列化器以支持对象序列化）
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # 消息发送确认机制
      acks: 1
      # 重试次数
      retries: 3
      # 批量发送的大小
      batch-size: 16384
      # 缓冲区大小
      buffer-memory: 33554432

# 自定义topic名称
kafka:
  topic:
    behavior: short_video_behavior_topic

  # Redis配置
    data:
      redis:
        host: localhost
        port: 6379
        database: 0
        timeout: 3000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
            max-wait: -1ms

  # MyBatisPlus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 腾讯云 COS 配置
tencent:
  cos:
    enabled: true
    secret-id: ${TENCENT_SECRET_ID:default}
    secret-key: ${TENCENT_SECRET_KEY:default}
    region: ap-guangzhou
    bucket-name: short-video-1396257793
    base-path: shortmovie/video/
    expire-time: 3600

# JWT配置
jwt:
  secret: your-secret-key-change-this-in-production-environment-at-least-256-bits
  expiration: 86400000

# 推荐系统配置
recommendation:
  heat-score-weights:
    play: 1.0
    like: 3.0
    comment: 5.0
    collect: 8.0
  cache-ttl: 600

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 系统管理
      paths-to-match: /**
      packages-to-scan:
        - com.example.shortmovie.controller
  default-flat-param-object: true




knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表